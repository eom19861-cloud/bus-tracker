name: Collect arrival history

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Ping collector
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets required"
            exit 1
          fi
          ARGS=(-H "Authorization: Bearer ${CRON_SECRET}")
          if [ -n "$BYPASS" ]; then
            ARGS+=(-H "x-vercel-protection-bypass: ${BYPASS}")
          fi
          curl -fsS -X POST "${ARGS[@]}" "${APP_URL%/}/api/cron-history"
