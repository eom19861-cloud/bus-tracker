name: Collect arrival history

on:
  schedule:
    # GitHub 예약은 몇 시간 밀릴 수 있어, 한 번 시작되면 오래 반복 수집한다.
    - cron: "10 */4 * * *"
  workflow_dispatch:

concurrency:
  group: collect-arrivals
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Poll favorites for several hours
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets required"
            exit 1
          fi
          ARGS=(-H "Authorization: Bearer ${CRON_SECRET}")
          if [ -n "$BYPASS" ]; then
            ARGS+=(-H "x-vercel-protection-bypass: ${BYPASS}")
          fi
          end=$((SECONDS + 340 * 60))
          while [ "$SECONDS" -lt "$end" ]; do
            body=$(curl -fsS -X POST "${ARGS[@]}" "${APP_URL%/}/api/cron-history" || true)
            echo "$body"
            if echo "$body" | grep -q "watchlist empty"; then
              sleep 600
            else
              sleep 90
            fi
          done
