<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>광역버스 실시간 위치 · 2D</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --panel: rgba(12, 16, 22, 0.88);
      --text: #f2f4f7;
      --muted: #9aa3af;
      --line: rgba(255, 255, 255, 0.08);
      --accent: #ff5a3d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: "IBM Plex Sans KR", sans-serif;
      color: var(--text);
      background: #0b0f14;
    }
    #map { position: absolute; inset: 0; }

    #panel {
      position: absolute; top: 16px; left: 16px; z-index: 1000;
      width: min(300px, calc(100vw - 32px));
      max-width: calc(100vw - 32px);
      max-height: calc(100dvh - 32px);
      padding: 16px 18px;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    #panel h1 {
      margin: 0;
      font-family: Outfit, sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #panelToggle {
      flex: none;
      margin-left: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 6px 10px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    #panelToggle:hover { background: rgba(255,255,255,0.1); }
    #panel.collapsed .panel-body { display: none; }
    #panel.collapsed .status-row { margin-bottom: 0; }
    .panel-body { min-width: 0; }
    #settingsToggle {
      width: 100%;
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 9px 12px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #settingsToggle:hover { background: rgba(255,255,255,0.1); }
    #settingsToggle .chevron {
      color: var(--muted);
      transition: transform 0.15s ease;
    }
    #settingsToggle[aria-expanded="true"] .chevron {
      transform: rotate(180deg);
    }
    #moreSettings {
      display: none;
      min-width: 0;
    }
    #moreSettings.open { display: block; }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0 12px;
    }
    #status {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }
    #refreshBtn {
      flex: none;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 6px 10px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    #refreshBtn:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
    #refreshBtn:disabled { opacity: 0.55; cursor: wait; }
    .route-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      font-size: 13px;
      user-select: none;
    }
    .route-toggle input { accent-color: var(--accent); }
    .swatch {
      width: 12px; height: 12px; border-radius: 999px; flex: none;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.08);
    }
    .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
    .route-toggle .remove {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
      line-height: 1;
    }
    .route-toggle .remove:hover { color: #ff8a80; }
    .add-route {
      display: grid;
      gap: 8px;
      margin-top: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      min-width: 0;
      width: 100%;
    }
    .add-route-row {
      display: flex;
      align-items: stretch;
      gap: 6px;
      min-width: 0;
      width: 100%;
    }
    .add-route input {
      flex: 1 1 0;
      width: 0;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
    }
    .add-route button {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .add-route button:hover { background: rgba(255,255,255,0.1); }
    .search-results {
      display: grid;
      gap: 4px;
      max-height: 160px;
      overflow: auto;
    }
    .search-results:empty { display: none; }
    .search-item {
      display: grid;
      gap: 2px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
      cursor: pointer;
    }
    .search-item:hover { background: rgba(255,255,255,0.08); }
    .search-item strong { font-size: 13px; }
    .search-item span { font-size: 11px; color: var(--muted); }
    .path-mode {
      display: grid;
      gap: 6px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }
    .path-mode .chk {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      cursor: pointer;
    }
    .path-mode .chk input { accent-color: var(--accent); }
    .path-mode select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
    }

    #hint {
      position: absolute; right: 16px; bottom: 28px; z-index: 1000;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(12, 16, 22, 0.75);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      backdrop-filter: blur(10px);
    }
    #hint a { color: #d7dde5; text-decoration: none; font-weight: 600; }
    #hint a:hover { color: #fff; }

    .bus-marker {
      width: 28px; height: 40px;
      margin-left: -14px; margin-top: -20px;
      transform-origin: 50% 50%;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35));
    }
    .bus-marker svg { display: block; width: 100%; height: 100%; }
    .bus-label {
      position: absolute; left: 50%; top: -2px;
      transform: translate(-50%, -100%);
      background: #fff; border: 2px solid #333; border-radius: 6px;
      font-size: 11px; font-weight: 700; padding: 1px 4px; white-space: nowrap;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      pointer-events: none;
    }

    .leaflet-popup-content-wrapper {
      background: #121820;
      color: #f2f4f7;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      font-family: "IBM Plex Sans KR", sans-serif;
    }
    .leaflet-popup-content {
      margin: 10px 14px;
      font-size: 13px;
      line-height: 1.45;
      color: #f2f4f7;
    }
    .leaflet-popup-content strong { color: #ffffff; font-weight: 600; }
    .leaflet-popup-tip { background: #121820; }
    .leaflet-container a.leaflet-popup-close-button {
      color: #9aa3af;
      padding: 6px 8px 0 0;
    }
    .leaflet-container a.leaflet-popup-close-button:hover { color: #ffffff; }

    .popup-arrivals {
      margin-top: 8px;
      display: grid;
      gap: 6px;
      min-width: 160px;
    }
    .popup-arrival-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
    }
    .popup-arrival-name {
      font-weight: 600;
      color: #ffe566;
      white-space: nowrap;
    }
    .popup-arrival-eta {
      color: #d7dde5;
      text-align: right;
    }
    .popup-arrival-eta .next {
      display: block;
      color: #9aa3af;
      font-size: 11px;
      margin-top: 2px;
    }
    .popup-muted {
      margin-top: 8px;
      color: #9aa3af;
      font-size: 12px;
    }
    .popup-fav-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .popup-fav-actions button {
      flex: 1;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      color: #f2f4f7;
      padding: 6px 8px;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    .popup-fav-actions button:hover { background: rgba(255,255,255,0.12); }
    .popup-fav-actions button.active {
      border-color: rgba(255, 90, 61, 0.55);
      background: rgba(255, 90, 61, 0.18);
      color: #ffc2b5;
    }
    .favorites {
      display: grid;
      gap: 8px;
      margin: 0 0 10px;
    }
    .favorites:empty { display: none; }
    .fav-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      padding: 10px 12px;
      cursor: pointer;
      text-align: left;
      color: inherit;
      font: inherit;
      width: 100%;
    }
    .fav-card:hover { background: rgba(255,255,255,0.07); }
    .fav-card-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .fav-badge {
      flex: none;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 90, 61, 0.2);
      color: #ffb4a6;
    }
    .fav-badge.work {
      background: rgba(30, 136, 229, 0.22);
      color: #9fd0ff;
    }
    .fav-name {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .fav-remove {
      flex: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
      line-height: 1;
    }
    .fav-remove:hover { color: #ff8a80; }
    .fav-arrivals {
      display: grid;
      gap: 4px;
      font-size: 12px;
    }
    .fav-arrival-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
    }
    .fav-arrival-row strong { color: #ffe566; font-weight: 600; }
    .fav-hint {
      margin: 0 0 10px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }
    #panel.collapsed .fav-hint { display: none; }
    .fav-hint.is-hidden { display: none; }
    .alert-settings {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }
    .alert-settings .title {
      color: var(--text);
      font-weight: 600;
      font-size: 12px;
    }
    .alert-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      flex-wrap: wrap;
    }
    .alert-row input[type="checkbox"] { accent-color: var(--accent); }
    .alert-row select {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      padding: 4px 8px;
      font: inherit;
    }
    .alert-note {
      font-size: 11px;
      line-height: 1.4;
      color: var(--muted);
    }
    .commute-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
    }
    #commuteToggle {
      flex: none;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 6px 10px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    #commuteToggle:hover { background: rgba(255,255,255,0.1); }
    #commuteToggle.active {
      border-color: rgba(255, 90, 61, 0.55);
      background: rgba(255, 90, 61, 0.18);
      color: #ffc2b5;
    }
    .commute-label {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.35;
    }
    #commuteBoard {
      display: none;
      gap: 10px;
      margin: 0 0 12px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 90, 61, 0.28);
      background: linear-gradient(160deg, rgba(255,90,61,0.14), rgba(255,255,255,0.03));
    }
    #commuteBoard.active { display: grid; }
    .commute-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .commute-head strong { font-size: 15px; color: #fff; }
    .commute-head span { font-size: 11px; color: var(--muted); }
    .commute-stop { font-size: 12px; color: #d7dde5; }
    .commute-list { display: grid; gap: 8px; }
    .commute-row {
      display: grid;
      gap: 2px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(0,0,0,0.22);
      border: 1px solid var(--line);
      cursor: pointer;
      text-align: left;
      color: inherit;
      font: inherit;
      width: 100%;
    }
    .commute-row:hover { background: rgba(0,0,0,0.32); }
    .commute-row-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
    }
    .commute-route { font-size: 16px; font-weight: 700; color: #ffe566; }
    .commute-eta { font-size: 15px; font-weight: 600; color: #fff; }
    .commute-meta { font-size: 11px; color: var(--muted); }
    .commute-empty { font-size: 12px; color: var(--muted); }
    #panel.commute-on .favorites { display: none; }
    #panel.commute-on .fav-hint { display: none; }
    .alert-row select,
    .alert-row input[type="time"] {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      padding: 4px 8px;
      font: inherit;
      color-scheme: dark;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <div class="panel-header">
      <h1>광역버스 2D</h1>
      <button type="button" id="panelToggle" aria-expanded="true" title="패널 접기/펼치기">접기</button>
    </div>
    <div class="status-row">
      <div id="status">불러오는 중…</div>
      <button type="button" id="refreshBtn" title="지금 위치 다시 불러오기">새로고침</button>
    </div>
    <div class="commute-bar" id="commuteBar">
      <button type="button" id="commuteToggle" title="퇴근 모드">퇴근 모드</button>
      <div class="commute-label" id="commuteLabel">평일 저녁에 회사 정류장 도착을 크게 보여줍니다.</div>
    </div>
    <div id="commuteBoard"></div>
    <p class="fav-hint" id="favHint">정류장을 눌러 집·회사로 저장하면 여기에 도착정보가 표시됩니다.</p>
    <div id="favorites" class="favorites"></div>
    <div class="panel-body">
      <div id="routes"></div>
      <div class="add-route">
        <div class="add-route-row">
          <input id="routeQuery" type="text" placeholder="버스 번호" inputmode="search" />
          <button type="button" id="routeSearchBtn">검색</button>
        </div>
        <div id="searchResults" class="search-results"></div>
      </div>
      <button type="button" id="settingsToggle" aria-expanded="false" aria-controls="moreSettings">
        <span>설정</span>
        <span class="chevron">▾</span>
      </button>
      <div id="moreSettings">
        <label class="path-mode">
          <span class="chk">
            <input type="checkbox" id="showStations" checked />
            정류장 표시
          </span>
        </label>
        <div class="alert-settings">
          <div class="title">알림 (집·회사 정류장)</div>
          <label class="alert-row">
            <input type="checkbox" id="arrivalAlert" />
            도착
            <select id="arrivalMinutes" aria-label="몇 분 전 알림">
              <option value="3">3분</option>
              <option value="5" selected>5분</option>
              <option value="7">7분</option>
              <option value="10">10분</option>
            </select>
            전
          </label>
          <label class="alert-row">
            <input type="checkbox" id="fullAlert" />
            만차일 때 알림
          </label>
          <div class="alert-note" id="alertNote">페이지를 켠 동안만 브라우저 알림이 옵니다. 집·회사 정류장을 먼저 저장하세요.</div>
        </div>
        <div class="alert-settings">
          <div class="title">퇴근 모드</div>
          <label class="alert-row">
            <input type="checkbox" id="commuteAuto" checked />
            평일 자동 켜기
          </label>
          <label class="alert-row">
            <span>시간</span>
            <input type="time" id="commuteStart" value="17:30" />
            ~
            <input type="time" id="commuteEnd" value="21:00" />
          </label>
          <label class="alert-row">
            기준 정류장
            <select id="commuteStop">
              <option value="work" selected>회사</option>
              <option value="home">집</option>
              <option value="both">회사+집</option>
            </select>
          </label>
          <div class="alert-note">자동 시간대에는 퇴근 모드가 켜지고, 도착 요약을 먼저 보여줍니다.</div>
        </div>
      </div>
    </div>
  </div>
  <div id="hint">드래그 · 스크롤로 이동 · <a href="/">3D로 전환</a></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="past-timetable.js"></script>
  <script>
    const STORAGE_KEY = 'bus-tracker-routes-v2';
    const SETTINGS_KEY = 'bus-tracker-settings-v1';
    const FAVORITES_KEY = 'bus-tracker-favorites-v1';
    const FAV_LABELS = { home: '집', work: '회사' };
    const DEFAULT_ROUTES = [
      { routeId: '234001245', name: 'M4108', color: '#e53935' },
      { routeId: '233000270', name: '4108', color: '#1e88e5' },
    ];
    const ROUTE_COLORS = ['#e53935', '#1e88e5', '#43a047', '#fb8c00', '#8e24aa', '#00897b', '#f4511e', '#3949ab'];
    const REFRESH_MS = 30000;

    let ROUTES = loadSavedRoutes();

    const map = L.map('map').setView([37.5, 127.0], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 19,
    }).addTo(map);

    const statusEl = document.getElementById('status');
    const routesEl = document.getElementById('routes');
    const favoritesEl = document.getElementById('favorites');
    const favHintEl = document.getElementById('favHint');
    const searchResultsEl = document.getElementById('searchResults');
    const routeQueryEl = document.getElementById('routeQuery');
    const showStationsEl = document.getElementById('showStations');
    const refreshBtn = document.getElementById('refreshBtn');
    const state = {};
    let favorites = loadFavorites();
    let favoriteMarkers = {};
    let refreshing = false;
    let didFit = false;
    const alertNotified = new Map();
    let commuteManual = null;
    let commuteActive = false;
    let commuteCache = {};

    function parseHm(hm) {
      const [h, m] = String(hm || '0:0').split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    }

    function getCommuteSettings() {
      return {
        auto: document.getElementById('commuteAuto')?.checked ?? true,
        start: document.getElementById('commuteStart')?.value || '17:30',
        end: document.getElementById('commuteEnd')?.value || '21:00',
        stop: document.getElementById('commuteStop')?.value || 'work',
      };
    }

    function isCommuteTimeWindow() {
      const cfg = getCommuteSettings();
      if (!cfg.auto) return false;
      const now = new Date();
      const day = now.getDay();
      if (day === 0 || day === 6) return false;
      const mins = now.getHours() * 60 + now.getMinutes();
      const start = parseHm(cfg.start);
      const end = parseHm(cfg.end);
      if (start <= end) return mins >= start && mins <= end;
      return mins >= start || mins <= end;
    }

    function resolveCommuteActive() {
      if (commuteManual === true) return true;
      if (commuteManual === false) return false;
      return isCommuteTimeWindow();
    }

    function commuteRoles() {
      const stop = getCommuteSettings().stop;
      const roles = [];
      if (stop === 'home' || stop === 'both') {
        if (favorites.home) roles.push('home');
      }
      if (stop === 'work' || stop === 'both') {
        if (favorites.work) roles.push('work');
      }
      if (!roles.length) {
        if (favorites.work) roles.push('work');
        else if (favorites.home) roles.push('home');
      }
      return roles;
    }

    function updateCommuteUi() {
      commuteActive = resolveCommuteActive();
      const panel = document.getElementById('panel');
      const btn = document.getElementById('commuteToggle');
      const label = document.getElementById('commuteLabel');
      const board = document.getElementById('commuteBoard');
      panel.classList.toggle('commute-on', commuteActive);
      btn.classList.toggle('active', commuteActive);
      btn.textContent = commuteActive ? '퇴근 모드 ON' : '퇴근 모드';

      if (commuteManual === true) {
        label.textContent = '수동으로 켠 상태입니다. 다시 누르면 끕니다.';
      } else if (commuteManual === false) {
        label.textContent = '수동으로 끈 상태입니다. 다시 누르면 자동으로 돌아갑니다.';
      } else if (isCommuteTimeWindow()) {
        label.textContent = '평일 퇴근 시간대라 자동으로 켜져 있습니다.';
      } else {
        const cfg = getCommuteSettings();
        label.textContent = cfg.auto
          ? `평일 ${cfg.start}~${cfg.end}에 자동으로 켜집니다.`
          : '자동이 꺼져 있습니다. 버튼을 눌러 직접 켜세요.';
      }

      if (!commuteActive) {
        board.classList.remove('active');
        board.innerHTML = '';
        return;
      }
      renderCommuteBoard();
    }

    function renderCommuteBoard() {
      const board = document.getElementById('commuteBoard');
      const roles = commuteRoles();
      if (!roles.length) {
        board.classList.add('active');
        board.innerHTML = `<div class="commute-empty">회사(또는 집) 정류장을 저장하면 퇴근 요약이 표시됩니다.</div>`;
        return;
      }

      board.classList.add('active');
      board.innerHTML = roles.map(role => {
        const fav = favorites[role];
        const arrivals = commuteCache[role]?.arrivals;
        const error = commuteCache[role]?.error;
        let body = '';
        if (error) {
          body = `<div class="commute-empty">${escapeHtml(error)}</div>`;
        } else if (!arrivals) {
          body = `<div class="commute-empty">도착정보 불러오는 중…</div>`;
        } else if (!arrivals.length) {
          body = `<div class="commute-empty">추가한 노선의 도착정보가 없습니다.</div>`;
        } else {
          body = `<div class="commute-list">${arrivals.map(a => {
            const seat = a.remainSeat1 === 0
              ? '만차'
              : (a.remainSeat1 != null && a.remainSeat1 >= 0 ? `${a.remainSeat1}석` : '');
            const next = a.eta2 ? `다음 ${escapeHtml(a.eta2)}` : '';
            const meta = [seat, next].filter(Boolean).join(' · ');
            return `<button type="button" class="commute-row" data-commute-role="${role}">
              <div class="commute-row-top">
                <span class="commute-route">${escapeHtml(a.routeName || a.routeId)}</span>
                <span class="commute-eta">${escapeHtml(a.eta1 || '정보 없음')}</span>
              </div>
              ${meta ? `<div class="commute-meta">${escapeHtml(meta)}</div>` : ''}
            </button>`;
          }).join('')}</div>`;
        }
        return `<div>
          <div class="commute-head">
            <strong>${FAV_LABELS[role]}</strong>
            <span>탈까 말까</span>
          </div>
          <div class="commute-stop">${escapeHtml(fav.name)}</div>
          ${body}
        </div>`;
      }).join('');

      board.querySelectorAll('[data-commute-role]').forEach(el => {
        el.addEventListener('click', () => {
          focusFavorite(el.getAttribute('data-commute-role'));
        });
      });
    }

    function wireCommuteMode() {
      document.getElementById('commuteToggle').addEventListener('click', () => {
        if (commuteManual === null) {
          commuteManual = !resolveCommuteActive();
        } else if (commuteManual === true) {
          commuteManual = false;
        } else {
          commuteManual = null;
        }
        updateCommuteUi();
        if (commuteActive) refreshFavoriteArrivals().catch(console.warn);
      });

      ['commuteAuto', 'commuteStart', 'commuteEnd', 'commuteStop'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
          if (id !== 'commuteStop') commuteManual = null;
          saveSettings();
          updateCommuteUi();
          if (commuteActive) refreshFavoriteArrivals().catch(console.warn);
        });
      });

      setInterval(() => {
        const before = commuteActive;
        updateCommuteUi();
        if (!before && commuteActive) refreshFavoriteArrivals().catch(console.warn);
      }, 60000);
    }

    function getAlertSettings() {
      return {
        arrivalAlert: document.getElementById('arrivalAlert')?.checked ?? false,
        arrivalMinutes: Number(document.getElementById('arrivalMinutes')?.value || 5),
        fullAlert: document.getElementById('fullAlert')?.checked ?? false,
      };
    }

    function updateAlertNote() {
      const note = document.getElementById('alertNote');
      if (!note) return;
      if (!('Notification' in window)) {
        note.textContent = '이 브라우저는 알림을 지원하지 않습니다.';
        return;
      }
      const perm = Notification.permission;
      if (perm === 'denied') {
        note.textContent = '알림이 차단되어 있습니다. 브라우저 사이트 설정에서 허용해 주세요.';
      } else if (perm === 'granted') {
        note.textContent = '페이지를 켠 동안 집·회사 정류장 기준으로 알림이 옵니다.';
      } else {
        note.textContent = '알림을 켜면 권한 요청이 뜹니다. 집·회사 정류장을 먼저 저장하세요.';
      }
    }

    async function ensureNotificationPermission() {
      if (!('Notification' in window)) return false;
      if (Notification.permission === 'granted') return true;
      if (Notification.permission === 'denied') {
        updateAlertNote();
        return false;
      }
      const result = await Notification.requestPermission();
      updateAlertNote();
      return result === 'granted';
    }

    function showBusNotification(title, body, tag) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      try {
        const n = new Notification(title, { body, tag, renotify: false });
        n.onclick = () => { window.focus(); n.close(); };
      } catch (err) {
        console.warn('notification failed', err);
      }
    }

    function evaluateAlerts(role, fav, arrivals) {
      const cfg = getAlertSettings();
      if (!cfg.arrivalAlert && !cfg.fullAlert) return;
      if (!arrivals?.length) return;

      const thresholdSec = Math.max(1, cfg.arrivalMinutes) * 60;

      arrivals.forEach(a => {
        const routeName = a.routeName || a.routeId;
        const place = `${FAV_LABELS[role]} · ${fav.name}`;
        const etaSec = Number.isFinite(a.etaSec1) ? a.etaSec1 : null;
        const plate = a.plateNo1 || 'bus1';

        if (cfg.arrivalAlert && etaSec != null && a.flag !== 'STOP' && a.flag !== 'WAIT') {
          const key = `arr:${role}:${a.routeId}:${plate}`;
          if (etaSec <= thresholdSec && !alertNotified.has(key)) {
            const etaText = a.eta1 || `${Math.ceil(etaSec / 60)}분 후`;
            showBusNotification(
              `${routeName} ${cfg.arrivalMinutes}분 전`,
              `${place} · ${etaText} 도착 예정`,
              key
            );
            alertNotified.set(key, true);
          }
          if (etaSec > thresholdSec) alertNotified.delete(key);
        }

        if (cfg.fullAlert && a.remainSeat1 === 0) {
          const key = `full:${role}:${a.routeId}:${plate}`;
          if (!alertNotified.has(key)) {
            const etaText = a.eta1 ? ` · ${a.eta1}` : '';
            showBusNotification(`${routeName} 만차`, `${place}${etaText}`, key);
            alertNotified.set(key, true);
          }
        } else if (a.remainSeat1 == null || a.remainSeat1 > 0) {
          alertNotified.delete(`full:${role}:${a.routeId}:${plate}`);
        }
      });
    }

    function loadFavorites() {
      try {
        const raw = localStorage.getItem(FAVORITES_KEY);
        if (!raw) return { home: null, work: null };
        const parsed = JSON.parse(raw) || {};
        const clean = (v) => {
          if (!v || !v.stationId || !v.name) return null;
          const lat = Number(v.lat);
          const lng = Number(v.lng);
          return {
            stationId: String(v.stationId),
            name: String(v.name),
            lat: Number.isFinite(lat) ? lat : null,
            lng: Number.isFinite(lng) ? lng : null,
          };
        };
        return { home: clean(parsed.home), work: clean(parsed.work) };
      } catch {
        return { home: null, work: null };
      }
    }

    function saveFavorites() {
      localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
    }

    function favoriteRoleForStation(stationId) {
      if (!stationId) return null;
      if (favorites.home?.stationId === String(stationId)) return 'home';
      if (favorites.work?.stationId === String(stationId)) return 'work';
      return null;
    }

    function setFavorite(role, station) {
      if (role !== 'home' && role !== 'work') return;
      const next = {
        stationId: String(station.stationId),
        name: String(station.name || '정류장'),
        lat: station.lat != null ? Number(station.lat) : null,
        lng: station.lng != null ? Number(station.lng) : null,
      };
      if (role === 'home' && favorites.work?.stationId === next.stationId) favorites.work = null;
      if (role === 'work' && favorites.home?.stationId === next.stationId) favorites.home = null;
      favorites[role] = next;
      saveFavorites();
      renderFavorites();
      refreshFavoriteArrivals().catch(console.warn);
      syncFavoriteMarkers();
      statusEl.textContent = `${FAV_LABELS[role]} 정류장 저장: ${next.name}`;
    }

    function clearFavorite(role) {
      if (!favorites[role]) return;
      const name = favorites[role].name;
      favorites[role] = null;
      saveFavorites();
      renderFavorites();
      syncFavoriteMarkers();
      statusEl.textContent = `${FAV_LABELS[role]} 정류장 해제: ${name}`;
    }

    function renderFavorites() {
      const hasAny = !!(favorites.home || favorites.work);
      favHintEl.classList.toggle('is-hidden', hasAny);
      favoritesEl.innerHTML = '';
      ['home', 'work'].forEach(role => {
        const fav = favorites[role];
        if (!fav) return;
        const card = document.createElement('div');
        card.className = 'fav-card';
        card.innerHTML = `
          <div class="fav-card-top">
            <span class="fav-badge ${role}">${FAV_LABELS[role]}</span>
            <span class="fav-name">${escapeHtml(fav.name)}</span>
            <button type="button" class="fav-remove" title="즐겨찾기 해제" data-clear="${role}">×</button>
          </div>
          <div class="fav-arrivals" id="fav-arrivals-${role}">도착정보 불러오는 중…</div>`;
        favoritesEl.appendChild(card);
        card.addEventListener('click', (e) => {
          if (e.target.closest('[data-clear]')) return;
          focusFavorite(role);
        });
        card.querySelector('[data-clear]').addEventListener('click', (e) => {
          e.stopPropagation();
          clearFavorite(role);
        });
      });
    }

    function focusFavorite(role) {
      const fav = favorites[role];
      if (!fav || fav.lat == null || fav.lng == null) return;
      map.setView([fav.lat, fav.lng], Math.max(map.getZoom(), 14));
    }

    function syncFavoriteMarkers() {
      Object.values(favoriteMarkers).forEach(m => m.remove());
      favoriteMarkers = {};
      ['home', 'work'].forEach(role => {
        const fav = favorites[role];
        if (!fav || fav.lat == null || fav.lng == null) return;
        const color = role === 'home' ? '#c4472f' : '#1e88e5';
        const icon = L.divIcon({
          className: '',
          html: `<div style="padding:4px 8px;border-radius:999px;font:600 11px 'IBM Plex Sans KR',sans-serif;color:#fff;background:${color};border:1px solid rgba(255,255,255,.2);box-shadow:0 4px 14px rgba(0,0,0,.35);white-space:nowrap">${FAV_LABELS[role]}</div>`,
          iconSize: [40, 24],
          iconAnchor: [20, 24],
        });
        const marker = L.marker([fav.lat, fav.lng], { icon, zIndexOffset: 1000 });
        marker.on('click', () => focusFavorite(role));
        marker.addTo(map);
        favoriteMarkers[role] = marker;
      });
    }

    async function refreshFavoriteArrivals() {
      const roles = ['home', 'work'].filter(role => favorites[role]);
      if (!roles.length) {
        updateCommuteUi();
        return;
      }
      await Promise.all(roles.map(async (role) => {
        const box = document.getElementById(`fav-arrivals-${role}`);
        const fav = favorites[role];
        try {
          const { arrivals, error } = await fetchStationArrivals(fav.stationId);
          commuteCache[role] = { arrivals, error };
          if (box) {
            if (error) {
              box.textContent = error;
            } else if (!arrivals.length) {
              box.textContent = '추가한 노선의 도착정보가 없습니다.';
            } else {
              box.innerHTML = arrivals.map(a => {
                const seat = (a.remainSeat1 != null && a.remainSeat1 >= 0) ? ` · ${a.remainSeat1}석` : '';
                const next = a.eta2 ? ` / 다음 ${escapeHtml(a.eta2)}` : '';
                return `<div class="fav-arrival-row"><strong>${escapeHtml(a.routeName || a.routeId)}</strong><span>${escapeHtml(a.eta1 || '정보 없음')}${seat}${next}</span></div>`;
              }).join('');
            }
          }
          if (!error && arrivals?.length) evaluateAlerts(role, fav, arrivals);
        } catch (err) {
          commuteCache[role] = { arrivals: [], error: String(err?.message || err) };
          if (box) box.textContent = String(err?.message || err);
        }
      }));
      updateCommuteUi();
    }

    function loadSavedRoutes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return DEFAULT_ROUTES.map(r => ({ ...r }));
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed) || !parsed.length) return DEFAULT_ROUTES.map(r => ({ ...r }));
        return parsed
          .filter(r => r && r.routeId && r.name)
          .map(r => ({
            routeId: String(r.routeId),
            name: String(r.name),
            color: r.color || ROUTE_COLORS[0],
          }));
      } catch {
        return DEFAULT_ROUTES.map(r => ({ ...r }));
      }
    }

    function saveRoutes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(ROUTES));
    }

    function loadSettings() {
      try {
        return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') || {};
      } catch {
        return {};
      }
    }

    function saveSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({
        showStations: showStationsEl.checked,
        panelCollapsed: document.getElementById('panel').classList.contains('collapsed'),
        settingsOpen: document.getElementById('moreSettings').classList.contains('open'),
        arrivalAlert: document.getElementById('arrivalAlert').checked,
        arrivalMinutes: Number(document.getElementById('arrivalMinutes').value || 5),
        fullAlert: document.getElementById('fullAlert').checked,
        commuteAuto: document.getElementById('commuteAuto').checked,
        commuteStart: document.getElementById('commuteStart').value || '17:30',
        commuteEnd: document.getElementById('commuteEnd').value || '21:00',
        commuteStop: document.getElementById('commuteStop').value || 'work',
      }));
    }

    function applySettings() {
      const s = loadSettings();
      if (typeof s.showStations === 'boolean') showStationsEl.checked = s.showStations;
      if (typeof s.arrivalAlert === 'boolean') document.getElementById('arrivalAlert').checked = s.arrivalAlert;
      if (s.arrivalMinutes) document.getElementById('arrivalMinutes').value = String(s.arrivalMinutes);
      if (typeof s.fullAlert === 'boolean') document.getElementById('fullAlert').checked = s.fullAlert;
      if (typeof s.commuteAuto === 'boolean') document.getElementById('commuteAuto').checked = s.commuteAuto;
      if (s.commuteStart) document.getElementById('commuteStart').value = s.commuteStart;
      if (s.commuteEnd) document.getElementById('commuteEnd').value = s.commuteEnd;
      if (s.commuteStop) document.getElementById('commuteStop').value = s.commuteStop;
      updateAlertNote();
      updateCommuteUi();
    }

    function setSettingsOpen(open, persist = true) {
      const box = document.getElementById('moreSettings');
      const btn = document.getElementById('settingsToggle');
      box.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.querySelector('span').textContent = open ? '설정 접기' : '설정';
      if (persist) saveSettings();
    }

    function initSettingsCollapse() {
      const s = loadSettings();
      const open = typeof s.settingsOpen === 'boolean'
        ? s.settingsOpen
        : !isNarrowScreen();
      setSettingsOpen(open, false);
      document.getElementById('settingsToggle').addEventListener('click', () => {
        setSettingsOpen(!document.getElementById('moreSettings').classList.contains('open'));
      });
    }

    function wireAlertSettings() {
      const arrivalAlertEl = document.getElementById('arrivalAlert');
      const fullAlertEl = document.getElementById('fullAlert');
      const arrivalMinutesEl = document.getElementById('arrivalMinutes');

      const onToggle = async (el) => {
        if (el.checked) {
          const ok = await ensureNotificationPermission();
          if (!ok) {
            el.checked = false;
            statusEl.textContent = '알림 권한이 없어 설정을 켤 수 없습니다.';
          }
        }
        saveSettings();
        updateAlertNote();
      };

      arrivalAlertEl.addEventListener('change', () => onToggle(arrivalAlertEl));
      fullAlertEl.addEventListener('change', () => onToggle(fullAlertEl));
      arrivalMinutesEl.addEventListener('change', () => {
        for (const key of [...alertNotified.keys()]) {
          if (key.startsWith('arr:')) alertNotified.delete(key);
        }
        saveSettings();
      });
    }

    function isNarrowScreen() {
      return window.matchMedia('(max-width: 640px)').matches;
    }

    function setPanelCollapsed(collapsed, persist = true) {
      const panel = document.getElementById('panel');
      const btn = document.getElementById('panelToggle');
      panel.classList.toggle('collapsed', collapsed);
      btn.textContent = collapsed ? '펼치기' : '접기';
      btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      if (persist) saveSettings();
    }

    function initPanelCollapse() {
      const s = loadSettings();
      const collapsed = typeof s.panelCollapsed === 'boolean'
        ? s.panelCollapsed
        : isNarrowScreen();
      setPanelCollapsed(collapsed, false);
      document.getElementById('panelToggle').addEventListener('click', () => {
        setPanelCollapsed(!document.getElementById('panel').classList.contains('collapsed'));
      });
    }

    function nextRouteColor() {
      const used = new Set(ROUTES.map(r => r.color));
      return ROUTE_COLORS.find(c => !used.has(c)) || ROUTE_COLORS[ROUTES.length % ROUTE_COLORS.length];
    }

    function ensureState(rt) {
      if (state[rt.routeId]) return;
      state[rt.routeId] = {
        visible: true,
        markers: {},
        line: null,
        stations: [],
        path: [],
        prevPos: {},
        stationMarkers: [],
      };
    }

    function clearRouteLayers(routeId) {
      const s = state[routeId];
      if (!s) return;
      Object.values(s.markers).forEach(m => m.remove());
      if (s.line) s.line.remove();
      (s.stationMarkers || []).forEach(m => m.remove());
      delete state[routeId];
    }

    function setStationsVisible(show) {
      ROUTES.forEach(rt => {
        const s = state[rt.routeId];
        if (!s) return;
        (s.stationMarkers || []).forEach(m => {
          if (show && s.visible) m.addTo(map);
          else m.remove();
        });
      });
    }

    function toggleRoute(rt, show) {
      const s = state[rt.routeId];
      if (!s) return;
      Object.values(s.markers).forEach(m => show ? m.addTo(map) : m.remove());
      if (s.line) show ? s.line.addTo(map) : s.line.remove();
      (s.stationMarkers || []).forEach(m => {
        if (show && showStationsEl.checked) m.addTo(map);
        else m.remove();
      });
    }

    function renderRouteList() {
      routesEl.innerHTML = '';
      ROUTES.forEach(rt => {
        ensureState(rt);
        const row = document.createElement('div');
        row.className = 'route-toggle';
        row.innerHTML = `
          <label style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;min-width:0">
            <input type="checkbox" ${state[rt.routeId].visible ? 'checked' : ''} data-route="${rt.routeId}">
            <span class="swatch" style="background:${rt.color}"></span>
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${rt.name}</span>
            <span class="count" id="cnt-${rt.routeId}">-</span>
          </label>
          <button type="button" class="remove" title="노선 삭제" data-remove="${rt.routeId}">×</button>`;
        routesEl.appendChild(row);

        row.querySelector('input').addEventListener('change', e => {
          state[rt.routeId].visible = e.target.checked;
          toggleRoute(rt, e.target.checked);
        });
        row.querySelector('[data-remove]').addEventListener('click', () => {
          removeRoute(rt.routeId);
        });
      });
    }

    async function addRoute(route) {
      const routeId = String(route.routeId);
      if (ROUTES.some(r => r.routeId === routeId)) {
        statusEl.textContent = `${route.routeName || route.name} 은(는) 이미 추가되어 있습니다.`;
        return;
      }
      const rt = {
        routeId,
        name: String(route.routeName || route.name),
        color: nextRouteColor(),
      };
      ROUTES.push(rt);
      saveRoutes();
      ensureState(rt);
      renderRouteList();
      searchResultsEl.innerHTML = '';
      routeQueryEl.value = '';

      statusEl.textContent = `${rt.name} 노선 불러오는 중…`;
      await drawRoute(rt, 'official');
      await updateBuses(rt);
      statusEl.textContent = `${rt.name} 추가됨`;
    }

    function removeRoute(routeId) {
      const rt = ROUTES.find(r => r.routeId === routeId);
      if (!rt) return;
      ROUTES = ROUTES.filter(r => r.routeId !== routeId);
      saveRoutes();
      clearRouteLayers(routeId);
      renderRouteList();
      statusEl.textContent = `${rt.name} 삭제됨`;
    }

    async function searchRoutes() {
      const q = routeQueryEl.value.trim();
      if (!q) {
        statusEl.textContent = '버스 번호를 입력하세요.';
        return;
      }
      statusEl.textContent = `"${q}" 검색 중…`;
      searchResultsEl.innerHTML = '';
      try {
        const r = await fetch(`/api/find?q=${encodeURIComponent(q)}`);
        const data = await r.json();
        const routes = data.routes || [];
        if (!routes.length) {
          statusEl.textContent = `"${q}" 검색 결과가 없습니다.`;
          return;
        }
        routes.forEach(item => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'search-item';
          btn.innerHTML = `<strong>${item.routeName}</strong><span>${item.region || ''} · ${item.type || ''} · ${item.routeId}</span>`;
          btn.addEventListener('click', () => addRoute(item));
          searchResultsEl.appendChild(btn);
        });
        statusEl.textContent = `${routes.length}개 노선 찾음 · 눌러서 추가`;
      } catch (err) {
        statusEl.textContent = `검색 실패: ${err.message || err}`;
      }
    }

    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function arrivalPopupHtml(stationName, arrivals, meta = {}) {
      const title = `<strong>${escapeHtml(stationName || '정류장')}</strong>`;
      let body = '';
      if (meta.loading) {
        body = `<div class="popup-muted">도착정보 불러오는 중…</div>`;
      } else if (meta.error) {
        body = `<div class="popup-muted">${escapeHtml(meta.error)}</div>`;
      } else if (!arrivals?.length) {
        body = `<div class="popup-muted">추가한 노선의 도착정보가 없습니다.</div>`;
      } else {
        const rows = arrivals.map(a => {
          const name = escapeHtml(a.routeName || a.routeId);
          const eta1 = escapeHtml(a.eta1 || '정보 없음');
          const seat = (a.remainSeat1 != null && a.remainSeat1 >= 0)
            ? ` · ${a.remainSeat1}석`
            : '';
          const next = a.eta2
            ? `<span class="next">다음 ${escapeHtml(a.eta2)}</span>`
            : '';
          return `<div class="popup-arrival-row">
            <span class="popup-arrival-name">${name}</span>
            <span class="popup-arrival-eta">${eta1}${seat}${next}</span>
          </div>`;
        }).join('');
        body = `<div class="popup-arrivals">${rows}</div>`;
      }

      const sid = meta.stationId ? String(meta.stationId) : '';
      const role = sid ? favoriteRoleForStation(sid) : null;
      const lat = meta.lat != null ? Number(meta.lat) : '';
      const lng = meta.lng != null ? Number(meta.lng) : '';
      const prefer = ROUTES.map(r => r.routeId).filter(Boolean).join(',');
      const routeId = meta.routeId ? String(meta.routeId) : '';
      const timetableBtn = sid ? `
        <button type="button" class="popup-timetable-btn"
          data-open-timetable
          data-station-id="${escapeHtml(sid)}"
          data-station-name="${escapeHtml(stationName || '정류장')}"
          data-route-id="${escapeHtml(routeId)}"
          data-prefer-route-ids="${escapeHtml(prefer)}">과거 시간표</button>` : '';
      const actions = sid ? `
        <div class="popup-fav-actions">
          <button type="button" class="${role === 'home' ? 'active' : ''}"
            data-fav-role="home"
            data-station-id="${escapeHtml(sid)}"
            data-station-name="${escapeHtml(stationName || '정류장')}"
            data-lat="${lat}"
            data-lng="${lng}">${role === 'home' ? '집 해제' : '집으로'}</button>
          <button type="button" class="${role === 'work' ? 'active' : ''}"
            data-fav-role="work"
            data-station-id="${escapeHtml(sid)}"
            data-station-name="${escapeHtml(stationName || '정류장')}"
            data-lat="${lat}"
            data-lng="${lng}">${role === 'work' ? '회사 해제' : '회사로'}</button>
        </div>` : '';
      return `${title}${body}${timetableBtn}${actions}`;
    }

    async function fetchStationArrivals(stationId) {
      const routeIds = ROUTES.map(r => r.routeId).join(',');
      const r = await fetch(
        `/api/arrival?stationId=${encodeURIComponent(stationId)}&routeIds=${encodeURIComponent(routeIds)}`
      );
      const data = await r.json();
      if (data.rateLimited || data.authError || data.error) {
        return {
          arrivals: [],
          error: data.error
            || data.authError?.returnAuthMsg
            || data.authError?.errMsg
            || '도착정보를 불러오지 못했습니다.',
        };
      }
      const nameById = Object.fromEntries(ROUTES.map(rt => [rt.routeId, rt.name]));
      const arrivals = (data.arrivals || []).map(a => ({
        ...a,
        routeName: nameById[a.routeId] || a.routeName,
      }));
      if (window.PastTimetable) window.PastTimetable.recordArrivals(stationId, arrivals);
      return { arrivals };
    }

    async function drawRoute(rt, pathMode = 'official') {
      try {
        const r = await fetch(`/api/route?routeId=${rt.routeId}&pathMode=${encodeURIComponent(pathMode)}`);
        const data = await r.json();
        ensureState(rt);
        const s = state[rt.routeId];

        if (s.line) { s.line.remove(); s.line = null; }
        (s.stationMarkers || []).forEach(m => m.remove());
        s.stationMarkers = [];

        s.stations = data.stations || [];
        s.path = data.path || data.stations || [];
        const pts = s.path;
        if (pts.length) {
          s.line = L.polyline(pts.map(p => [p.lat, p.lng]), {
            color: rt.color, weight: 4, opacity: 0.55,
            lineJoin: 'round', lineCap: 'round',
          });
          if (s.visible) s.line.addTo(map);
        }
        s.stationMarkers = (data.stations || []).map(st => {
          const m = L.circleMarker([st.lat, st.lng], {
            radius: 5,
            color: rt.color,
            weight: 2,
            fillColor: '#fff',
            fillOpacity: 1,
          });
          const metaBase = { stationId: st.stationId || '', lat: st.lat, lng: st.lng, routeId: rt.routeId };
          m.bindPopup(arrivalPopupHtml(st.name || '정류장', [], { loading: true, ...metaBase }), {
            maxWidth: 280,
          });
          m.on('popupopen', async () => {
            const popup = m.getPopup();
            if (!st.stationId) {
              popup.setContent(arrivalPopupHtml(st.name || '정류장', [], {
                error: '정류소 ID가 없어 도착정보를 조회할 수 없습니다.',
                ...metaBase,
              }));
              return;
            }
            try {
              const { arrivals, error } = await fetchStationArrivals(st.stationId);
              popup.setContent(arrivalPopupHtml(st.name || '정류장', arrivals, { error, ...metaBase }));
            } catch (err) {
              popup.setContent(arrivalPopupHtml(st.name || '정류장', [], {
                error: String(err?.message || err),
                ...metaBase,
              }));
            }
          });
          if (s.visible && showStationsEl.checked) m.addTo(map);
          return m;
        });
      } catch (e) {
        console.warn('노선 경로 로드 실패', rt.name, e);
      }
    }

    async function reloadPaths() {
      statusEl.textContent = '경로 다시 그리는 중…';
      await Promise.all(ROUTES.map(rt => drawRoute(rt, 'official')));
      statusEl.textContent = '경로 갱신됨';
    }

    function toRad(d) { return d * Math.PI / 180; }
    function toDeg(r) { return r * 180 / Math.PI; }
    function bearingBetween(lng1, lat1, lng2, lat2) {
      const φ1 = toRad(lat1), φ2 = toRad(lat2), Δλ = toRad(lng2 - lng1);
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }
    function distMeters(lng1, lat1, lng2, lat2) {
      const dy = (lat2 - lat1) * 111320;
      const dx = (lng2 - lng1) * 111320 * Math.cos(toRad((lat1 + lat2) / 2));
      return Math.hypot(dx, dy);
    }
    function bearingFromPath(path, lng, lat) {
      if (!path || path.length < 2) return 0;
      let best = 0, bestD = Infinity;
      for (let i = 0; i < path.length - 1; i++) {
        const a = path[i], b = path[i + 1];
        const d = distMeters(lng, lat, (a.lng + b.lng) / 2, (a.lat + b.lat) / 2);
        if (d < bestD) {
          bestD = d;
          best = bearingBetween(a.lng, a.lat, b.lng, b.lat);
        }
      }
      return best;
    }
    function resolveBearing(rt, bus) {
      const s = state[rt.routeId];
      const prev = s.prevPos[bus.plateNo];
      if (prev && distMeters(prev.lng, prev.lat, bus.lng, bus.lat) > 8) {
        return bearingBetween(prev.lng, prev.lat, bus.lng, bus.lat);
      }
      const idx = s.stations.findIndex(st => String(st.seq) === String(bus.stationSeq));
      if (idx >= 0) {
        const next = s.stations[idx + 1] || s.stations[idx - 1];
        if (next) return bearingBetween(s.stations[idx].lng, s.stations[idx].lat, next.lng, next.lat);
      }
      if (prev?.bearing != null) return prev.bearing;
      return bearingFromPath(s.path?.length ? s.path : s.stations, bus.lng, bus.lat);
    }

    function busIconHtml(color, label, bearing) {
      return `
        <div class="bus-marker" style="transform:rotate(${bearing}deg)">
          <svg viewBox="0 0 28 40" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 10 L14 2 L20 10 Z" fill="${color}"/>
            <rect x="6" y="10" width="16" height="26" rx="4" fill="${color}" stroke="#fff" stroke-width="2"/>
            <circle cx="5" cy="16" r="2" fill="#fff"/>
            <circle cx="23" cy="16" r="2" fill="#fff"/>
            <circle cx="5" cy="30" r="2" fill="#fff"/>
            <circle cx="23" cy="30" r="2" fill="#fff"/>
          </svg>
        </div>
        <div class="bus-label" style="border-color:${color}">${label}</div>`;
    }

    function animateMarker(marker, toLatLng) {
      const from = marker.getLatLng();
      const start = performance.now(), dur = 1000;
      function step(now) {
        const t = Math.min((now - start) / dur, 1);
        marker.setLatLng([
          from.lat + (toLatLng[0] - from.lat) * t,
          from.lng + (toLatLng[1] - from.lng) * t,
        ]);
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    async function updateBuses(rt) {
      try {
        const r = await fetch(`/api/bus?routeId=${rt.routeId}`);
        const data = await r.json();
        ensureState(rt);
        const s = state[rt.routeId];
        const cntEl = document.getElementById(`cnt-${rt.routeId}`);
        if (cntEl) cntEl.textContent = `${data.count ?? 0}대`;

        if (data.rateLimited || data.authError || data.error) {
          Object.values(s.markers).forEach(m => m.remove());
          s.markers = {};
          return {
            count: 0,
            apiError: data.error
              || data.authError?.returnAuthMsg
              || data.authError?.errMsg
              || 'API 오류',
            rateLimited: !!data.rateLimited,
          };
        }

        const seen = new Set();
        const nextPrev = {};
        (data.buses || []).forEach(b => {
          seen.add(b.plateNo);
          const label = b.remainSeat >= 0 ? `${rt.name} ${b.remainSeat}석` : rt.name;
          const bearing = resolveBearing(rt, b);
          nextPrev[b.plateNo] = { lng: b.lng, lat: b.lat, bearing };
          if (s.markers[b.plateNo]) {
            animateMarker(s.markers[b.plateNo], [b.lat, b.lng]);
            const el = s.markers[b.plateNo].getElement();
            const iconEl = el?.querySelector('.bus-marker');
            const labelEl = el?.querySelector('.bus-label');
            if (iconEl) iconEl.style.transform = `rotate(${bearing}deg)`;
            if (labelEl) labelEl.textContent = label;
          } else {
            const icon = L.divIcon({
              className: '',
              html: busIconHtml(rt.color, label, bearing),
              iconSize: [28, 40],
              iconAnchor: [14, 20],
            });
            const m = L.marker([b.lat, b.lng], { icon });
            if (s.visible) m.addTo(map);
            s.markers[b.plateNo] = m;
          }
        });
        s.prevPos = nextPrev;
        Object.keys(s.markers).forEach(p => {
          if (!seen.has(p)) { s.markers[p].remove(); delete s.markers[p]; }
        });
        return { count: data.count ?? 0 };
      } catch (e) {
        console.warn('버스 위치 로드 실패', rt.name, e);
        return { count: 0, apiError: String(e?.message || e) };
      }
    }

    async function tick(manual = false) {
      if (refreshing) return;
      refreshing = true;
      refreshBtn.disabled = true;
      if (manual) statusEl.textContent = '위치 새로고침 중…';
      try {
        const results = await Promise.all(ROUTES.map(updateBuses));
        const total = results.reduce((a, b) => a + (b.count || 0), 0);
        const apiErr = results.find(r => r.apiError);
        const stamp = new Date().toLocaleTimeString('ko-KR');
        if (apiErr) {
          statusEl.textContent = apiErr.rateLimited
            ? `API 일일 한도 초과 · ${stamp}`
            : `${apiErr.apiError} · ${stamp}`;
        } else {
          statusEl.textContent = manual
            ? `운행 ${total}대 · ${stamp} 수동 갱신`
            : `운행 ${total}대 · ${stamp} 갱신`;
        }

        refreshFavoriteArrivals().catch(console.warn);

        if (!didFit) {
          if (favorites.home?.lat != null) {
            didFit = true;
            focusFavorite('home');
          } else if (favorites.work?.lat != null) {
            didFit = true;
            focusFavorite('work');
          } else if (total > 0) {
            didFit = true;
            const first = ROUTES
              .flatMap(rt => Object.values(state[rt.routeId]?.markers || {}))[0];
            if (first) map.setView(first.getLatLng(), 12);
          }
        }
      } finally {
        refreshing = false;
        refreshBtn.disabled = false;
      }
    }

    function wireFavoritePopupActions() {
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-fav-role]');
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        const role = btn.getAttribute('data-fav-role');
        const stationId = btn.getAttribute('data-station-id');
        if (!role || !stationId) return;
        const name = btn.getAttribute('data-station-name') || '정류장';
        const lat = Number(btn.getAttribute('data-lat'));
        const lng = Number(btn.getAttribute('data-lng'));
        if (favoriteRoleForStation(stationId) === role) {
          clearFavorite(role);
        } else {
          setFavorite(role, { stationId, name, lat, lng });
        }
        // 열린 팝업 내용 갱신
        map.eachLayer((layer) => {
          if (layer.getPopup && layer.isPopupOpen && layer.isPopupOpen()) {
            layer.setPopupContent(arrivalPopupHtml(name, [], {
              loading: true,
              stationId,
              lat,
              lng,
            }));
            fetchStationArrivals(stationId).then(({ arrivals, error }) => {
              layer.setPopupContent(arrivalPopupHtml(name, arrivals, {
                error,
                stationId,
                lat,
                lng,
              }));
            }).catch((err) => {
              layer.setPopupContent(arrivalPopupHtml(name, [], {
                error: String(err?.message || err),
                stationId,
                lat,
                lng,
              }));
            });
          }
        });
      });
    }

    applySettings();
    initPanelCollapse();
    initSettingsCollapse();
    renderRouteList();
    renderFavorites();
    syncFavoriteMarkers();
    wireFavoritePopupActions();
    wireAlertSettings();
    wireCommuteMode();
    refreshFavoriteArrivals().catch(console.warn);

    showStationsEl.addEventListener('change', () => {
      saveSettings();
      setStationsVisible(showStationsEl.checked);
    });
    document.getElementById('routeSearchBtn').addEventListener('click', () => {
      searchRoutes().catch(console.warn);
    });
    routeQueryEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        searchRoutes().catch(console.warn);
      }
    });
    refreshBtn.addEventListener('click', () => {
      tick(true).catch(console.warn);
    });

    (async function init() {
      statusEl.textContent = '노선 불러오는 중…';
      await Promise.all(ROUTES.map(rt => drawRoute(rt, 'official')));
      statusEl.textContent = '버스 위치 불러오는 중…';
      await tick();
      setInterval(() => { tick().catch(console.warn); }, REFRESH_MS);
    })();
  </script>
</body>
